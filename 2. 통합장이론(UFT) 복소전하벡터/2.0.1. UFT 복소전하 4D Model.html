<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFT 복소전하 4D Model V.70</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow-x: hidden; 
            overflow-y: auto; 
            background-color: #0d1117; 
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }
        #title-box {
            position: fixed; 
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            pointer-events: none;
        }
        #info-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(18, 26, 35, 0.85); 
            color: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #22c55e;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            font-size: 0.85rem;
            width: 320px; 
            line-height: 1.5;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 3px;
        }
        .info-label { font-weight: bold; color: #94a3b8; }
        .info-value { text-align: right; }

        #controls-panel {
            position: fixed; 
            top: 60px; 
            right: 20px; 
            z-index: 10;
            background: rgba(18, 26, 35, 0.9); 
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .speed-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .speed-display { font-size: 1.1rem; font-weight: 700; color: #ffffff; margin-bottom: 0.6rem; }
        input[type=range] { width: 100%; height: 6px; background: #475569; border-radius: 3px; outline: none; -webkit-appearance: none; margin-bottom: 1rem; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #22c55e; cursor: pointer; border: 2px solid white; }
        .state-display { background-color: #334155; color: #e2e8f0; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
        
        .slow-group { display: flex; gap: 4px; margin-bottom: 1rem; }
        .slow-btn { flex: 3; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.3s; border: 2px solid #fbbf24; background: transparent; color: #fbbf24; }
        .slow-btn.active { background: #fbbf24; color: #0d1117; }
        .slow-toggle-btn { flex: 2; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; border: 1px solid #94a3b8; background: #1e293b; color: white; }
        .slow-toggle-btn:hover { background: #334155; }

        .nav-group { display: flex; gap: 8px; margin-bottom: 0; }
        .nav-btn { flex: 1; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; color: white; border: none; display: flex; align-items: center; justify-content: center; }
        .btn-pause { background-color: #dc2626; } 
        .btn-play { background-color: #16a34a; } 
        .btn-reset { background-color: #0e7490; } 
        .mouse-guide { margin-top: 1rem; text-align: center; font-size: 0.75rem; color: #64748b; }
        .speed-indicator-container { position: relative; height: 15px; margin-top: 5px; }
        .speed-marker { position: absolute; top: 100%; transform: translateX(-50%); font-size: 0.65rem; color: #94a3b8; white-space: nowrap; }
        
        .mag-control-box { background-color: #1e293b; border-radius: 8px; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; }
        .mag-display { background-color: #0f172a; color: #fbbf24; font-family: monospace; font-size: 0.9rem; text-align: center; padding: 4px 0; border-radius: 4px; margin: 0 5px; flex-grow: 1; }
        .mag-btn { background-color: #1d4ed8; color: white; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s; height: 2rem; width: 2rem; display: flex; align-items: center; justify-content: center; border: none; }
        .mag-btn:hover { background-color: #2563eb; }
        .mag-btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; opacity: 0.4; }

        #webgl-error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="title-box">
        <h1 class="text-3xl font-bold text-white">UFT 복소전하 4D Model V.70</h1>
        <p class="text-gray-400 text-sm mt-1">블루 톤 자기장 필드 및 수직 화살표 투명도 보정</p>
    </div>

    <div id="info-box">
    
    
        <!-- UFT 전문 보기 로그인 안내 카드 (Teaser Card) -->
        <div class="teaser-card" style="margin-top:60px; padding:35px; background:linear-gradient(135deg, rgba(32,29,51,0.75) 0%, rgba(60,42,99,0.45) 100%); border:1px solid #5d3d9c; border-radius:14px; text-align:center; box-shadow: 0 10px 40px rgba(0,0,0,0.65); backdrop-filter: blur(8px); max-width: 900px; margin-left: auto; margin-right: auto;">
            <div style="font-size:48px; margin-bottom:15px; animation: pulse 2s infinite;">🔐</div>
            <h4 style="color:#d6bcfa; margin: 0 0 12px 0; font-size:22px; font-weight:700; font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.5px;">이 챕터는 UFT 핵심 연구 기밀 문서입니다</h4>
            <p style="color:#a5b1c2; font-size:14.5px; line-height:1.7; margin: 0 0 25px 0; font-family:'Noto Sans KR',sans-serif; font-weight:300;">
                본 챕터의 상세 수식 유도, 물리량 계산 분석 및 시뮬레이션 원문을 열람하시려면<br>
                UFT 공동 연구자 계정 로그인이 필요합니다.
            </p>
            <button onclick="window.parent && window.parent.triggerLogin ? window.parent.triggerLogin() : window.location.href='/private/login/'" style="background:#7928ca; color:#fff; border:none; padding:13px 32px; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer; transition:all 0.2s; box-shadow: 0 4px 20px rgba(121,40,202,0.5); font-family:'Noto Sans KR',sans-serif;" onmouseover="this.style.background='#8e33eb'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='#7928ca'; this.style.transform='translateY(0)';">
                <i class="fas fa-user-lock" style="margin-right:8px;"></i> 연구자 로그인하여 전문 보기 (Read Full Version)
            </button>
            <style>
                @keyframes pulse {
                    0% { transform: scale(1); opacity: 0.9; }
                    50% { transform: scale(1.08); opacity: 1; }
                    100% { transform: scale(1); opacity: 0.9; }
                }
            </style>
        </div>

</body>
</html>
