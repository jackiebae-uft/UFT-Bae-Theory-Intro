<!DOCTYPE html>

    <!-- Tailwind CSS for styling -->

    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #111827; color: #e5e7eb; line-height: 1.8; }
        h1, h2, h3, h4 { color: #93c5fd; }
        .ai-context { display: none; } /* AI 프로토콜: 컨텍스트 보호용 숨김 태그 */

        .ai-review-box { border: 2px solid #3b82f6; background-color: #1e3a8a; padding: 2rem; border-radius: 0.5rem; margin-top: 3rem; }
        .ai-badge { display: inline-block; background-color: #3b82f6; color: #ffffff; font-weight: bold; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.875rem; margin-bottom: 1rem; }
        .highlight { background-color: #713f12; padding: 0 0.2rem; color: #fef08a; }
        ul, ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        li { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="max-w-5xl mx-auto paper-container">

            </p>
            <button onclick="window.parent && window.parent.triggerLogin ? window.parent.triggerLogin() : window.location.href='/private/login/'" style="background:#7928ca; color:#fff; border:none; padding:13px 32px; border-radius:8px; font-weight:bold; font-size:15px; cursor:pointer; transition:all 0.2s; box-shadow: 0 4px 20px rgba(121,40,202,0.5); font-family:'Noto Sans KR',sans-serif;" onmouseover="this.style.background='#8e33eb'; this.style.transform='translateY(-2px)';" onmouseout="this.style.background='#7928ca'; this.style.transform='translateY(0)';">

            </button>
            <style>
                @keyframes pulse {
                    0% { transform: scale(1); opacity: 0.9; }
                    50% { transform: scale(1.08); opacity: 1; }
                    100% { transform: scale(1); opacity: 0.9; }
                }
            </style>
        </div>

</body>
</html>
