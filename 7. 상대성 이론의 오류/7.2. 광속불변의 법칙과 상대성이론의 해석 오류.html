    <!-- Chosen Palette: Slate (Dark/Neutrals) + Indigo (Primary) + Amber (Accent/Contrast for UFT vs Relativity) -->
    <!-- Application Structure Plan: The SPA is structured as a vertical scrolling dashboard with sticky navigation to guide the user through the logical progression of the UFT argument. It starts with the Core Paradigm (introducing the fundamental equation separating event and observation), moves to an Interactive Kinematics Simulator (allowing users to visually prove the constant observed speed of light regardless of observer/source speeds), and concludes with a Deconstruction of Thought Experiments (using an interactive card/accordion layout to contrast Relativity and UFT perspectives). This structure transforms a theoretical paper into an experiential learning tool. -->
    <!-- Visualization & Content Choices: 
         - Core Paradigm: Goal: Inform. Method: Styled text and distinct equation blocks. Interaction: Smooth scroll navigation. Justification: Establishes the foundational logic before diving into complex math.
         - Kinematics Simulator: Goal: Compare/Change. Method: Chart.js Line Chart representing a Space-Time diagram. Interaction: Sliders to change velocities of objects A and B, dynamically updating the intersection point (observation) on the chart. Justification: Visualizes the abstract mathematical proof (t = L/(c+vA-vB)) in real-time, proving the observed speed is always c. Library: Chart.js (NO SVG).
         - Thought Experiments: Goal: Compare/Organize. Method: Interactive Grid with flip/expand cards. Interaction: Clicking a concept (e.g., Train-Lightning) reveals the UFT resolution vs Relativity. Justification: Directly addresses the famous paradoxes using the newly established kinematic logic. Uses Unicode icons instead of SVG.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
